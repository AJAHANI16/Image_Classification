name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU PyTorch
        run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install project and development tools
        run: python -m pip install -e ".[dev]"
      - name: Lint and formatting
        run: |
          ruff check .
          ruff format --check .
      - name: Unit and integration tests (no model downloads)
        run: pytest -q --run-multiworker
      - name: Check installed CLI
        run: image-classification smoke --output runs/ci-smoke
